# Static export: `next build` writes a plain out/ directory and Netlify
# serves it directly. No Next.js runtime, no server function.
#
# Why not the runtime: Netlify only auto-installs it for Git-linked builds.
# This project deploys by zip upload, where the framework is detected as
# "next" but plugin_state stays "none", so the repo root gets published
# instead of the build output. Declaring or installing the plugin to force
# it made the build fail outright. The site needs no server rendering, so
# exporting sidesteps all of it.
#
# next/image still optimizes: src/lib/image-loader.ts routes images through
# Netlify Image CDN at /.netlify/images.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
