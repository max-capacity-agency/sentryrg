# Netlify auto-detects Next.js and applies its runtime, which sets the
# publish directory and deploys the server handler as a function.
#
# Do NOT set `publish` here: pinning it to ".next" stops the runtime from
# running, and Netlify serves the raw build output as static files, which
# 404s at the root because pages land under server/app/ rather than /.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
