# The Next.js runtime sets its own publish directory and deploys the server
# handler as a function. Do NOT set `publish` here: pinning it to ".next"
# makes Netlify serve the raw build output as static files, which 404s at
# the root because the pages land under server/app/ rather than /.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Declared AND installed as a devDependency. Netlify only auto-installs the
# Next runtime for Git-linked builds; this project deploys by zip upload
# (deploy_source "api"), where auto-detection reports framework "next" but
# plugin_state stays "none" and the repo root gets published as a static
# site. Declaring it alone also failed: Netlify's on-the-fly install of the
# package returned exit 2. Pinning it in package.json fixes both.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
