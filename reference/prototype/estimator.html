<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roofing Quote Estimator</title>
<style id="__base-css">
/* Font links are injected at init from CONFIG (Google Fonts is the only external dependency). */
:root {
  /* All of these are overwritten at init from CONFIG.branding */
  --c-primary: #0d1b2e;
  --c-accent: #f5b301;
  --c-accent-ink: #10203a;
  --c-accent-deep: #9a7500;
  --c-bg: #f6f2ea;
  --c-text: #1a2230;
  --c-success: #4a6b52;
  --f-head: "Plus Jakarta Sans", system-ui, sans-serif;
  --f-body: "Plus Jakarta Sans", system-ui, sans-serif;
  --f-display: "Open Sauce One", -apple-system, BlinkMacSystemFont, sans-serif;
  --r: 12px;
  /* derived */
  --c-line: color-mix(in srgb, var(--c-text) 14%, transparent);
  --c-muted: color-mix(in srgb, var(--c-text) 58%, transparent);
  --c-card: #ffffff;
  --c-accent-soft: color-mix(in srgb, var(--c-accent) 12%, #fff);
  --c-primary-soft: color-mix(in srgb, var(--c-primary) 6%, #fff);
  --shadow-sm: 0 1px 2px rgba(20,25,30,.06), 0 1px 3px rgba(20,25,30,.05);
  --shadow-md: 0 6px 20px rgba(20,25,30,.08), 0 2px 6px rgba(20,25,30,.05);
  --shadow-lg: 0 18px 44px rgba(20,25,30,.14);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #ffffff;
  color: var(--c-text);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
h1, h2, h3, .eyebrow { font-family: var(--f-head); }
h1, h2, h3 { line-height: 1.12; letter-spacing: -.01em; margin: 0; }
p { margin: 0; }
button { font-family: inherit; cursor: pointer; }
a { color: var(--c-accent-deep); }
a:hover { color: color-mix(in srgb, var(--c-accent) 78%, #000); }

/* ---------- Shell ---------- */
#app { min-height: 100dvh; display: flex; flex-direction: column; }
.wrap { width: 100%; max-width: 720px; margin: 0 auto; padding: 0 20px; }

/* Header band (deep slate) */
.hdr { background: var(--c-primary); color: #fff; padding: 14px 0 0; position: sticky; top: 0; z-index: 20; }
.hdr-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 600; font-size: 20px; letter-spacing: -.01em; }
.brand svg { display: block; }
.brand-logo { display: block; height: 40px; width: auto; }
@media (max-width: 520px) { .brand-logo { height: 32px; } }
.hdr-phone { display: inline-flex; align-items: center; gap: 7px; color: #fff; text-decoration: none; font-weight: 600; font-size: 14.5px; opacity: .92; white-space: nowrap; }
.hdr-phone:hover { opacity: 1; color: #fff; }
.hdr-phone svg { flex: none; }

/* Roofline progress */
.roofwrap { padding: 12px 0 14px; }
.roofline { width: 100%; height: 34px; display: block; overflow: visible; }
.roof-bg { fill: none; stroke: color-mix(in srgb, #fff 26%, transparent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.roof-fg { fill: none; stroke: var(--c-accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; transition: stroke-dashoffset .45s cubic-bezier(.2,.7,.2,1); }
.ridge-cap { fill: var(--c-accent); opacity: 0; transition: opacity .3s ease; }
.ridge-cap.on { opacity: 1; }
.step-count { margin-top: 6px; font-size: 12.5px; letter-spacing: .04em; text-transform: uppercase; color: color-mix(in srgb, #fff 72%, transparent); font-family: var(--f-head); font-weight: 600; }
.pbar { margin-top: 11px; height: 6px; border-radius: 999px; background: color-mix(in srgb, #fff 20%, transparent); overflow: hidden; }
.pbar-fill { height: 100%; border-radius: 999px; background: var(--c-accent); transition: width .45s cubic-bezier(.2,.7,.2,1); }

/* Main scroll area */
.main { flex: 1; padding: 26px 0 40px; }
@media (max-width: 560px) { .main { padding: 20px 0 120px; } }

/* Screen anim */
.screen { animation: fade .28s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .screen { animation: none; }
  .roof-fg { transition: none; }
  .card, .btn { transition: none !important; }
}

/* Typography blocks */
.eyebrow { text-transform: uppercase; letter-spacing: .09em; font-size: 12.5px; font-weight: 700; color: var(--c-accent-deep); margin-bottom: 10px; }
.q-title { font-family: var(--f-display); font-size: clamp(22px, 4.5vw, 30px); font-weight: 500; letter-spacing: -.01em; }
.q-help { color: var(--c-muted); margin-top: 8px; font-size: 15px; }
.lead { font-size: clamp(16px, 2.6vw, 18px); color: var(--c-muted); margin-top: 12px; }

/* Cards grid */
.grid { display: grid; gap: 12px; margin-top: 22px; }
.grid.two { grid-template-columns: 1fr 1fr; }
.grid.three { grid-template-columns: repeat(3, 1fr); }
.grid.svc { grid-template-columns: 1fr 1fr; }
@media (max-width: 560px) { .grid.three { grid-template-columns: 1fr 1fr; } .grid.svc { grid-template-columns: 1fr; } }

.card {
  position: relative; text-align: left; background: var(--c-card); color: var(--c-text);
  border: 1.5px solid var(--c-line); border-radius: var(--r); padding: 16px;
  display: flex; gap: 13px; align-items: flex-start; width: 100%;
  transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease; box-shadow: var(--shadow-sm);
}
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: color-mix(in srgb, var(--c-accent) 45%, var(--c-line)); }
.card:focus-visible { outline: 3px solid var(--c-accent); outline-offset: 2px; }
.card.sel { border-color: var(--c-accent); box-shadow: 0 0 0 1px var(--c-accent), var(--shadow-md); }
.card .ic { flex: none; width: 40px; height: 40px; border-radius: 10px; background: var(--c-primary-soft); color: var(--c-primary); display: grid; place-items: center; }
.card.sel .ic { background: var(--c-accent-soft); color: var(--c-accent-deep); }
.card .body { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
.card .lbl { font-family: var(--f-head); font-weight: 600; font-size: 16px; }
.card .sub { color: var(--c-muted); font-size: 13.5px; margin-top: 3px; }
.card .tag { display: inline-block; margin-top: 8px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--c-accent-deep); background: var(--c-accent-soft); padding: 3px 8px; border-radius: 999px; }
.card .chk { position: absolute; top: 12px; right: 12px; width: 22px; height: 22px; border-radius: 50%; background: var(--c-accent); color: var(--c-accent-ink); display: none; place-items: center; }
.card.sel .chk { display: grid; }
.card.compact { padding: 14px 15px; }
.card.compact .lbl { font-size: 15.5px; }

/* Chips (multi-select) */
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.chip {
  border: 1.5px solid var(--c-line); background: var(--c-card); color: var(--c-text);
  padding: 11px 16px; border-radius: 999px; font-size: 14.5px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 8px; transition: all .14s ease;
}
.chip:hover { border-color: color-mix(in srgb, var(--c-accent) 45%, var(--c-line)); }
.chip.sel { border-color: var(--c-accent); background: var(--c-accent-soft); color: color-mix(in srgb, var(--c-accent) 82%, #000); }
.chip:focus-visible { outline: 3px solid var(--c-accent); outline-offset: 2px; }
.chip .x { width: 15px; height: 15px; display: none; }
.chip.sel .x { display: inline-block; }

/* Inputs */
.field { margin-top: 16px; }
.field label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 7px; font-family: var(--f-head); }
.field .opt { color: var(--c-muted); font-weight: 500; }
.input, .textarea {
  width: 100%; border: 1.5px solid var(--c-line); border-radius: 10px; padding: 13px 14px;
  font-size: 16px; font-family: inherit; background: var(--c-card); color: var(--c-text);
}
.input:focus, .textarea:focus { outline: none; border-color: var(--c-accent); box-shadow: 0 0 0 3px var(--c-accent-soft); }
.textarea { min-height: 84px; resize: vertical; }
.err { color: #b4472f; font-size: 13px; margin-top: 6px; display: none; }
.err.on { display: block; }

/* Buttons / actions */
.actions { display: flex; gap: 12px; align-items: center; margin-top: 26px; flex-wrap: wrap; }
.btn {
  border: none; border-radius: 999px; padding: 15px 26px; font-size: 16px; font-weight: 700;
  font-family: var(--f-head); display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  transition: transform .14s ease, box-shadow .14s ease, background .14s ease; text-decoration: none;
}
.btn:focus-visible { outline: 3px solid var(--c-accent); outline-offset: 2px; }
.btn-primary { background: var(--c-accent); color: var(--c-accent-ink); box-shadow: var(--shadow-md); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); color: var(--c-accent-ink); }
.btn-slate { background: var(--c-primary); color: #fff; box-shadow: var(--shadow-md); }
.btn-slate:hover { transform: translateY(-2px); color: #fff; }
.btn-ghost { background: transparent; color: var(--c-text); border: 1.5px solid var(--c-line); }
.btn-ghost:hover { border-color: var(--c-accent); color: var(--c-text); }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.backlink { background: none; border: none; color: var(--c-muted); font-weight: 600; font-size: 14px; padding: 8px 0; display: inline-flex; align-items: center; gap: 6px; }
.backlink:hover { color: var(--c-text); }
.textlink { background: none; border: none; color: var(--c-muted); text-decoration: underline; font-size: 14px; padding: 6px; }
.textlink:hover { color: var(--c-text); }

/* Trust chips (welcome) */
.trust { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 26px; }
.trust .t { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--c-muted); font-weight: 500; }
.trust .t svg { color: var(--c-success); flex: none; }
.stars { display: inline-flex; align-items: center; gap: 6px; }
.stars svg { color: var(--c-accent); }
.replace-note { font-size: 11px; color: var(--c-muted); background: color-mix(in srgb, var(--c-text) 6%, transparent); padding: 2px 6px; border-radius: 5px; letter-spacing: .02em; }

/* Nudge / inline banner */
.nudge { margin-top: 16px; padding: 13px 15px; border-radius: 10px; background: var(--c-accent-soft); border: 1px solid color-mix(in srgb, var(--c-accent) 30%, transparent); font-size: 14px; color: color-mix(in srgb, var(--c-accent) 82%, #000); display: flex; gap: 10px; align-items: flex-start; }
.nudge button { background: none; border: none; color: var(--c-accent-deep); font-weight: 700; text-decoration: underline; padding: 0; font-size: 14px; }

/* Emergency banner */
.emergency { background: #7a1f16; color: #fff; }
.emergency-bar { background: #8a2418; color: #fff; padding: 11px 0; }
.emergency-bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.emergency-bar .msg { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 9px; }
.emergency-bar a { background: #fff; color: #8a2418; padding: 8px 14px; border-radius: 8px; font-weight: 700; text-decoration: none; font-size: 14px; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
.emergency-bar a:hover { color: #8a2418; }

/* ---------- Results ---------- */
.result-eyebrow { text-transform: uppercase; letter-spacing: .09em; font-size: 12.5px; font-weight: 700; color: var(--c-accent-deep); }
.range-hero { font-family: var(--f-display); font-weight: 600; font-size: clamp(34px, 8.5vw, 56px); line-height: 1.02; letter-spacing: -.02em; margin: 10px 0 4px; color: var(--c-primary); }
.range-sub { color: var(--c-muted); font-size: 15px; }
.recap { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.recap .r { font-size: 12.5px; background: var(--c-primary-soft); color: var(--c-primary); border: 1px solid var(--c-line); padding: 5px 11px; border-radius: 999px; font-weight: 600; }
.sum { list-style: none; margin: 16px 0 0; padding: 0; border: 1.5px solid var(--c-line); border-radius: var(--r); overflow: hidden; background: var(--c-card); box-shadow: var(--shadow-sm); }
.sum li { display: flex; justify-content: space-between; align-items: baseline; gap: 18px; padding: 12px 15px; font-size: 14px; border-top: 1px solid var(--c-line); }
.sum li:first-child { border-top: none; }
.sum .k { color: var(--c-muted); flex: 1 1 auto; }
.sum .v { color: var(--c-text); font-weight: 600; text-align: right; flex: 0 1 auto; }

/* Sub-question groups (compressed multi-question screens) */
.subq { margin-top: 24px; }
.subq:first-of-type { margin-top: 20px; }
.subq-lbl { font-family: var(--f-head); font-weight: 700; font-size: 15.5px; color: var(--c-text); }
.subq-help { color: var(--c-muted); font-size: 13.5px; margin-top: 3px; }
.subq .grid { margin-top: 12px; }

/* Image option cards (roof material) */
.grid.img { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 560px) { .grid.img { grid-template-columns: 1fr 1fr; } }
.card.imgcard { flex-direction: column; align-items: stretch; gap: 0; padding: 0; overflow: hidden; text-align: left; }
.card.imgcard .imgwrap { position: relative; width: 100%; aspect-ratio: 4 / 3; background: var(--c-primary-soft); display: block; }
.card.imgcard .imgwrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card.imgcard .imgwrap.noimg::after { content: "roof photo"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--c-muted); font-size: 12px; font-family: ui-monospace, monospace; letter-spacing: .04em; }
.card.imgcard .lbl { padding: 11px 13px; font-size: 14.5px; }
.card.imgcard .chk { top: 9px; right: 9px; }

/* "Other" reveal text field */
.other-wrap { margin-top: 12px; }
.other-input { width: 100%; border: 1.5px solid var(--c-line); border-radius: 10px; padding: 12px 13px; font-size: 15.5px; font-family: inherit; background: var(--c-card); color: var(--c-text); }
.other-input:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 1px; }

/* Google reviews badge */
.gbadge { display: inline-flex; align-items: center; gap: 8px; background: var(--c-card); border: 1.5px solid var(--c-line); border-radius: 999px; padding: 6px 13px 6px 10px; box-shadow: var(--shadow-sm); }
.gbadge .g { flex: none; }
.gbadge .gstars { display: inline-flex; gap: 1px; color: var(--c-accent); }
.gbadge .gtext { font-size: 12.5px; font-weight: 600; color: var(--c-text); white-space: nowrap; }
.gbadge .gtext b { font-weight: 700; }

/* Booking (calendar) screen */
.booking-frame { margin-top: 18px; border: 1.5px solid var(--c-line); border-radius: var(--r); overflow: hidden; background: var(--c-card); box-shadow: var(--shadow-sm); }
.booking-frame iframe { display: block; width: 100%; height: 680px; border: 0; }
@media (max-width: 560px) { .booking-frame iframe { height: 620px; } }

/* Results conversion: budget line + financing + social proof */
.budget-line { margin-top: 28px; margin-bottom: 14px; font-family: var(--f-display); font-weight: 500; font-size: clamp(20px, 3vw, 24px); color: var(--c-text); }
.finance { display: flex; gap: 12px; align-items: flex-start; margin-top: 16px; padding: 15px 16px; border-radius: var(--r); background: var(--c-primary-soft); border: 1px solid var(--c-line); }
.finance .ic { flex: none; color: var(--c-primary); margin-top: 1px; }
.finance h4 { font-size: 14.5px; font-weight: 700; margin: 0 0 3px; }
.finance p { font-size: 13.5px; color: var(--c-muted); line-height: 1.5; }
.proof { margin-top: 18px; }
.proof-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.proof-head h3 { font-size: 15px; font-weight: 700; }
.tstmnl { display: grid; gap: 12px; }
.tstmnl .q { background: var(--c-card); border: 1.5px solid var(--c-line); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow-sm); }
.tstmnl .q .qs { color: var(--c-accent); font-size: 13px; letter-spacing: 2px; margin-bottom: 7px; }
.tstmnl .q p { font-size: 14px; line-height: 1.55; }
.tstmnl .q .who { margin-top: 8px; font-size: 12.5px; color: var(--c-muted); font-weight: 600; }

.block { background: var(--c-card); border: 1.5px solid var(--c-line); border-radius: var(--r); padding: 18px 18px; margin-top: 16px; box-shadow: var(--shadow-sm); }
.block h3 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
.block.timeline { display: flex; gap: 13px; align-items: flex-start; }
.block.timeline .ic { flex: none; width: 38px; height: 38px; border-radius: 9px; background: var(--c-primary-soft); color: var(--c-primary); display: grid; place-items: center; }
.incl { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 10px; }
.incl li { display: flex; gap: 11px; align-items: flex-start; font-size: 14.5px; }
.incl li svg { flex: none; color: var(--c-success); margin-top: 1px; }
.shift { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 10px; }
.shift li { display: flex; gap: 11px; align-items: flex-start; font-size: 14px; color: var(--c-text); }
.shift li svg { flex: none; color: var(--c-muted); margin-top: 2px; }

.disclaimer { border: 1.5px solid var(--c-accent); background: var(--c-accent-soft); border-radius: var(--r); padding: 16px 18px; margin-top: 18px; }
.disclaimer h3 { font-size: 14px; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; color: color-mix(in srgb, var(--c-accent) 84%, #000); }
.disclaimer p { font-size: 13.5px; color: color-mix(in srgb, var(--c-text) 78%, transparent); line-height: 1.55; }

.result-cta { margin-top: 22px; display: grid; gap: 11px; }
.cta-note { font-size: 13.5px; color: var(--c-muted); text-align: center; }
.commercial-note { margin-top: 18px; padding: 14px 16px; border-radius: 10px; background: var(--c-primary); color: #fff; font-size: 14px; }

/* Confirmation steps */
.steps-num { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 16px; }
.steps-num li { display: flex; gap: 15px; align-items: flex-start; }
.steps-num .n { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--c-accent); color: var(--c-accent-ink); font-family: var(--f-head); font-weight: 700; display: grid; place-items: center; font-size: 15px; }
.steps-num .st-t { font-weight: 600; font-family: var(--f-head); }
.steps-num .st-d { color: var(--c-muted); font-size: 14px; margin-top: 2px; }

/* Inline gate (after_price mode) */
.inline-gate { border: 1.5px solid var(--c-accent); border-radius: var(--r); padding: 18px; margin-top: 22px; background: var(--c-card); box-shadow: var(--shadow-md); }

/* Consent / license */
.fineprint { font-size: 12.5px; color: var(--c-muted); margin-top: 14px; line-height: 1.5; }
.fineprint .lic { margin-top: 6px; display: block; }

/* Sticky mobile call bar */
.callbar { display: none; }
@media (max-width: 560px) {
  .callbar.on { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--c-primary); padding: 11px 16px calc(11px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 18px rgba(20,25,30,.18); gap: 10px; }
  .callbar a { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--c-accent); color: var(--c-accent-ink); text-decoration: none; font-weight: 700; font-family: var(--f-head); padding: 13px; border-radius: 999px; font-size: 15.5px; }
}

/* Footer strip */
.foot { background: var(--c-primary); color: color-mix(in srgb, #fff 76%, transparent); padding: 18px 0; font-size: 12.5px; }
.foot .wrap { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; justify-content: space-between; }
.foot a { color: color-mix(in srgb, #fff 88%, transparent); text-decoration: none; }

.pitch-ic, .shape-ic { width: 40px; height: 40px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
"use strict";

/* ============================================================
   CONFIG START  --  everything client-specific lives here.
   Nothing brand, price, or contact specific appears elsewhere.
   [DEMO] values ship under the fictional Your Roofing Inc roofing brand.
   ============================================================ */
const CONFIG = {
  business: {
    name: "Your Roofing Inc",                     // [DEMO: swap per client]
    phone: "(555) 812-4400",                    // [DEMO]
    email: "hello@yourroofinginc.com",             // [DEMO]
    bookingUrl: "#book",                         // [DEMO: real booking link per client]
    calendarUrl: "https://calendly.com/miket-13", // [DEMO booking calendar: swap for the client's own Calendly / Google booking link]
    licenseLine: "Licensed & insured. Employed crews, no subcontractors.",
    responsePromise: "We reply within one business day."
  },
  branding: {
    // Client logo. Reversed (light) artwork for the dark header band. [DEMO: swap per client]

/* --------------------------- Utilities --------------------------- */
function h(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }
function fmt(n) { return "$" + Math.round(n).toLocaleString("en-US"); }
function roundTo(n, step) { return Math.round(n / step) * step; }
function telHref(p) { return "tel:" + String(p).replace(/[^0-9+]/g, ""); }
function svcCfg(svc) { return CONFIG.services[svc] || {}; }
function P() { return CONFIG.pricing; }

/* --------------------------- App state --------------------------- */
const state = {
  screen: "welcome",
  propertyType: null,
  service: null,
  zip: "",
  answers: {},
  flow: [],
  stepIndex: 0,
  contact: { name: "", phone: "", email: "", address: "" },
  companyName: "",
  notes: "",
  gateStep: 0,          // 0 or 1 within the two-step gate (before_price)
  estimate: null,
  emergency: false,
  gateSubmitted: false, // used in after_price mode
  ctaChoice: null       // "book" | "call" | "callback"
};
const utm = captureUtm();

/* --------------------------- Init --------------------------- */
function init() {
  applyBranding();
  loadFonts();
  track("estimator_open");
  render();
}

function applyBranding() {
  const b = CONFIG.branding, r = document.documentElement.style;
  r.setProperty("--c-primary", b.colorPrimary);
  r.setProperty("--c-accent", b.colorAccent);
  r.setProperty("--c-accent-ink", b.colorAccentInk);
  r.setProperty("--c-accent-deep", b.colorAccentDeep);
  r.setProperty("--c-bg", b.colorBg);
  r.setProperty("--c-text", b.colorText);
  r.setProperty("--c-success", b.colorSuccess);
  r.setProperty("--r", b.radius);
  r.setProperty("--f-head", '"' + b.fontHeading + '", system-ui, sans-serif');
  r.setProperty("--f-body", '"' + b.fontBody + '", system-ui, sans-serif');
  r.setProperty("--f-display", '"' + b.fontDisplay + '", Georgia, serif');
  document.documentElement.lang = CONFIG.locale.lang || "en-US";
}

function loadFonts() {
  const fams = [CONFIG.branding.fontHeading, CONFIG.branding.fontBody, CONFIG.branding.fontDisplay]
    .filter(function (v, i, a) { return v && a.indexOf(v) === i; })
    .map(function (f) { return f.replace(/ /g, "+") + ":wght@400;500;600;700;800"; });
  const pre1 = h('<link rel="preconnect" href="https://fonts.googleapis.com">');
  const pre2 = h('<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>');
  const link = h('<link rel="stylesheet" href="https://fonts.googleapis.com/css2?' +
    fams.map(function (f) { return "family=" + f; }).join("&") + '&display=swap">');
  document.head.appendChild(pre1); document.head.appendChild(pre2); document.head.appendChild(link);
}

/* --------------------------- Tracking --------------------------- */
function captureUtm() {
  const p = new URLSearchParams(location.search), keys = ["utm_source", "utm_medium", "utm_campaign", "utm_term", "utm_content", "gclid", "fbclid"], o = {};
  keys.forEach(function (k) { if (p.get(k)) o[k] = p.get(k); });
  return o;
}
function track(event, extra) {
  const svc = state.service || "";
  try {
    if (CONFIG.tracking.ga4Id && typeof window.gtag === "function") window.gtag("event", event, Object.assign({ service: svc }, extra || {}));
    if (CONFIG.tracking.metaPixelId && typeof window.fbq === "function") window.fbq("trackCustom", event, Object.assign({ service: svc }, extra || {}));
  } catch (e) { /* tracking must never break the tool */ }
  if (CONFIG.tracking.postMessage) {
    try { window.parent.postMessage({ source: "roof-estimator", event: event, service: svc }, "*"); } catch (e) {}
  }
}

/* --------------------------- Flow control --------------------------- */
function buildFlow() {
  const qs = QUESTIONS[state.service] || [];
  const flow = [{ type: "zip" }];
  qs.forEach(function (q) {
    if (q.group) flow.push({ type: "group", group: q });
    else flow.push({ type: "question", q: q });
  });
  if (CONFIG.behavior.leadGate === "before_price") {
    flow.push({ type: "gate", step: 0 });
    flow.push({ type: "gate", step: 1 });
  }
  state.flow = flow;
  state.stepIndex = 0;
}

function currentStep() { return state.flow[state.stepIndex] || null; }

function goNext() {
  if (state.stepIndex < state.flow.length - 1) {
    state.stepIndex++;
    render(true);
  } else {
    finishFlow();
  }
}
function goBack() {
  if (state.screen === "service") { state.screen = "welcome"; render(true); return; }
  if (state.screen === "booking") { state.screen = "results"; render(true); return; }
  if (state.screen === "flow" && state.stepIndex > 0) {
    state.stepIndex--;
    render(true);
  } else if (state.screen === "flow" && state.stepIndex === 0) {
    // back out of the flow to where they started
    if (state.propertyType === "residential") { state.screen = "service"; }
    else { state.screen = "welcome"; state.service = null; }
    render(true);
  }
}

function finishFlow() {
  // before_price: gate already collected. Compute outcome now.
  state.estimate = isPricedService(state.service, state.answers) ? computeEstimate() : null;
  logLead();
  track("estimate_view");
  state.screen = isPricedService(state.service, state.answers) ? "results" : "confirmation";
  render(true);
}

/* ============================ PRICING ENGINE ============================
   DEMO RATES. Calibrate per client with their recent invoices at onboarding.
   Deterministic: same answers always produce the same range. */
function regionFactor(zip) {
  const p = P();
  if (zip && zip.length >= 3) {
    const pre = zip.slice(0, 3);
    if (Object.prototype.hasOwnProperty.call(p.regionFactors, pre)) return p.regionFactors[pre];
  }
  return p.regionDefault;
}

function computeEstimate() {
  const a = state.answers, p = P(), rf = regionFactor(state.zip);
  let lo = 0, hi = 0, roundStep = 100, area = null;

  if (state.service === "roof-replacement") {
    const fm = p.footprintMid[a.homeSize] || p.footprintMid.notsure;
    const pf = p.pitchFactor[a.steepness] || p.pitchFactor.moderate;
    const cf = p.complexityFactor[a.shape] || p.complexityFactor.average;
    const roofArea = fm * pf * cf;
    area = roofArea;
    const matKey = (a.newMaterial === "notsure" || !a.newMaterial) ? "architectural" : a.newMaterial;
    const mat = p.replacementPerSqft[matKey] || p.replacementPerSqft.architectural;
    const tear = p.tearOffAdder[a.currentRoof] || p.tearOffAdder.notsure;
    let baseLo = roofArea * (mat[0] + tear[0]);
    let baseHi = roofArea * (mat[1] + tear[1]);
    let mult = (p.storiesMult[a.stories] || 1) *
               (p.conditionMult[a.condition] || 1) *
               ((a.timeline === "asap") ? p.timelineMult.asap : p.timelineMult.other);
    const accessSel = (a.access || []).filter(function (x) { return x !== "none"; });
    const accAdd = Math.min(accessSel.length * p.accessAdderEach, p.accessAdderCap);
    mult = mult * (1 + accAdd);
    mult = Math.min(mult, p.replacementMultCap);
    lo = baseLo * mult * rf; hi = baseHi * mult * rf;
  }
  else if (state.service === "roof-repair") {
    const base = p.repairBase[a.extent] || p.repairBase.fewAreas;
    let mult = 1;
    if ((a.issues || []).indexOf("flashing") !== -1) mult *= p.repairMult.flashing;
    if (a.steepness === "steep") mult *= p.repairMult.steep;
    if (a.stories === "2" || a.stories === "3plus") mult *= p.repairMult.stories2plus;
    mult = Math.min(mult, p.repairMultCap);
    lo = base[0] * mult * rf; hi = base[1] * mult * rf; roundStep = 50;
  }
  else if (state.service === "gutters") {
    const fm = p.footprintMid[a.homeSize] || p.footprintMid.notsure;
    const lf = 4 * Math.sqrt(fm) * 1.10;
    if (a.needed === "repair") {
      lo = p.guttersRepairFlat[0] * rf; hi = p.guttersRepairFlat[1] * rf;
    } else {
      let per;
      if (a.needed === "guards") per = p.guttersGuardsPerLf;
      else if (a.needed === "copper" || a.material === "copper") per = p.guttersPerLf.copper;
      else per = p.guttersPerLf.seamless; // seamless aluminum default (incl. "not sure")
      let l = lf * per[0], hgh = lf * per[1];
      if (a.stories === "2" || a.stories === "3plus") { l *= p.guttersStories2plusMult; hgh *= p.guttersStories2plusMult; }
      lo = l * rf; hi = hgh * rf;
    }
  }
  else if (state.service === "siding") {
    if (a.scope === "repair") {
      lo = p.sidingRepairFlat[0] * rf; hi = p.sidingRepairFlat[1] * rf;
    } else {
      const fm = p.footprintMid[a.homeSize] || p.footprintMid.notsure;
      const perimeter = 4 * Math.sqrt(fm) * 1.10;
      const storiesNum = a.stories === "3plus" ? 3 : parseInt(a.stories || "1", 10);
      let wallArea = perimeter * 9.5 * storiesNum * 0.85;
      const matKey = (a.material === "engineered") ? "engineered" : "fiber"; // "match/not sure" -> fiber
      const mat = p.sidingPerSqft[matKey];
      let l = wallArea * mat[0], hgh = wallArea * mat[1];
      if (a.scope === "sides") { l *= p.sidingPartialMult; hgh *= p.sidingPartialMult; }
      lo = l * rf; hi = hgh * rf;
    }
  }
  else if (state.service === "skylights") {
    const per = p.skylightsEach[a.type] || p.skylightsEach.replace;
    const count = a.count === "3plus" ? 3 : parseInt(a.count || "1", 10);
    let l = per[0] * count, hgh = per[1] * count;
    if (a.steepness === "steep") { l *= p.skylightsSteepMult; hgh *= p.skylightsSteepMult; }
    lo = l * rf; hi = hgh * rf;
  }
  else if (state.service === "maintenance") {
    const fm = p.footprintMid[a.homeSize] || p.footprintMid.notsure;
    let plan;
    if (fm < 2000) plan = p.maintenanceAnnual.small;
    else if (fm <= 3200) plan = p.maintenanceAnnual.mid;
    else plan = p.maintenanceAnnual.large;
    lo = plan[0] * rf; hi = plan[1] * rf; roundStep = 1;
  }
  else if (state.service === "commercial") {
    const sf = p.commercialSqft[a.roofSize] || p.commercialSqft.notsure;
    area = sf;
    const sysKey = (a.system === "epdm" || a.system === "metal") ? a.system : "tpo"; // "not sure" -> TPO
    const sys = p.commercialPerSqft[sysKey];
    let l = sf * sys[0], hgh = sf * sys[1];
    const occ = p.commercialOccupiedMult[a.occupied] || 1;
    l *= occ; hgh *= occ;
    l *= (1 - p.commercialWiden); hgh *= (1 + p.commercialWiden);
    lo = l * rf; hi = hgh * rf;
  }

  return { low: roundTo(lo, roundStep), high: roundTo(hi, roundStep), currency: CONFIG.locale.currency || "USD", area: area };
}
/* ========================== END PRICING ENGINE ========================== */

function buildLead() {

    answers: Object.assign({}, state.answers, state.companyName ? { companyName: state.companyName } : {}),
    estimate: isPricedService(state.service, state.answers) ? state.estimate : null,
    contact: { name: c.name, phone: c.phone, email: c.email, address: c.address },
    notes: state.notes,
    utm: utm,
    page: { href: location.href, referrer: document.referrer }

}

/* --------------------------- Render --------------------------- */
const app = document.getElementById("app");

function showsChrome() {
  return state.screen === "flow" || state.screen === "results" || state.screen === "confirmation" || state.screen === "thankyou";
}
function inFlow() { return state.screen === "flow"; }

function progressFraction() {
  if (state.screen === "results" || state.screen === "confirmation" || state.screen === "thankyou") return 1;
  if (state.screen === "flow") return state.flow.length ? (state.stepIndex / state.flow.length) : 0;
  return 0;
}

function render(scrollTop) {
  app.innerHTML = "";
  app.appendChild(buildHeader());
  if (state.emergency && (state.screen === "flow" || state.screen === "confirmation")) {
    app.appendChild(buildEmergencyBar());
  }
  const main = h('<div class="main"></div>');
  const wrap = h('<div class="wrap"></div>');
  wrap.appendChild(buildScreen());
  main.appendChild(wrap);
  app.appendChild(main);
  app.appendChild(buildFooter());
  app.appendChild(buildCallBar());
  drawRoofline();
  if (scrollTop) window.scrollTo(0, 0);
}

function buildHeader() {
  const cls = state.emergency ? "hdr emergency" : "hdr";
  const hdr = h('<header class="' + cls + '"></header>');
  const wrap = h('<div class="wrap"></div>');
  const row = h('<div class="hdr-row"></div>');
  row.appendChild(h(CONFIG.branding.logoImg
    ? '<div class="brand"><img src="' + CONFIG.branding.logoImg + '" alt="' + esc(CONFIG.business.name) + '" class="brand-logo"></div>'
    : '<div class="brand"><span aria-hidden="true">' + CONFIG.branding.logoSvg + '</span><span>' + esc(CONFIG.business.name) + '</span></div>'));
  row.appendChild(h('<a class="hdr-phone" href="' + telHref(CONFIG.business.phone) + '" data-action="cta-call">' + IC.phone + '<span>' + esc(CONFIG.business.phone) + '</span></a>'));
  wrap.appendChild(row);
  if (showsChrome()) {
    wrap.appendChild(buildRoofProgress());
  } else {
    wrap.appendChild(h('<div style="height:14px"></div>'));
  }
  hdr.appendChild(wrap);
  return hdr;
}

function buildRoofProgress() {
  let label = "";
  if (state.screen === "flow") {
    const total = state.flow.length;
    label = "Step " + (state.stepIndex + 1) + " of " + total;
  } else if (state.screen === "results") {
    label = "Your estimate";
  } else if (state.screen === "confirmation") {
    label = "You're all set";
  } else {
    label = "Done";
  }
  const pct = Math.max(0, Math.min(100, Math.round(progressFraction() * 100)));
  const box = h(
    '<div class="roofwrap">' +
      '<svg class="roofline" viewBox="0 0 300 34" preserveAspectRatio="none" aria-hidden="true">' +
        '<polyline class="roof-bg" points="6,30 150,6 294,30" vector-effect="non-scaling-stroke"></polyline>' +
        '<polyline class="roof-fg" points="6,30 150,6 294,30" vector-effect="non-scaling-stroke"></polyline>' +
        '<circle class="ridge-cap" cx="150" cy="6" r="5"></circle>' +
      '</svg>' +
      '<div class="step-count">' + esc(label) + '</div>' +
      '<div class="pbar"><div class="pbar-fill" style="width:' + pct + '%"></div></div>' +
    '</div>'
  );
  return box;
}

function drawRoofline() {
  const fg = app.querySelector(".roof-fg");
  const cap = app.querySelector(".ridge-cap");
  if (!fg) return;
  const len = fg.getTotalLength();
  fg.style.strokeDasharray = len;
  const frac = progressFraction();
  fg.style.strokeDashoffset = len * (1 - frac);
  if (cap && frac >= 0.999) cap.classList.add("on");
}

/* ---- Screen router ---- */
function buildScreen() {
  const s = h('<div class="screen"></div>');
  switch (state.screen) {
    case "welcome": s.appendChild(scrWelcome()); break;
    case "propertyType": s.appendChild(scrPropertyType()); break;
    case "service": s.appendChild(scrService()); break;
    case "flow": s.appendChild(scrFlow()); break;
    case "results": s.appendChild(scrResults()); break;
    case "confirmation": s.appendChild(scrConfirmation()); break;
    case "thankyou": s.appendChild(scrThankYou()); break;
    case "booking": s.appendChild(scrBooking()); break;
  }
  return s;
}

/* ---- Flow (zip / questions / gate) ---- */
function scrFlow() {
  const step = currentStep();
  if (!step) return document.createDocumentFragment();
  if (step.type === "zip") return scrZip();
  if (step.type === "question") return scrQuestion(step.q);
  if (step.type === "group") return scrGroup(step.group);
  if (step.type === "gate") return scrGate(step.step);
  return document.createDocumentFragment();
}

function scrZip() {
  const f = document.createDocumentFragment();
  f.appendChild(backBtn());
  f.appendChild(h('<h2 class="q-title">Where is the property?</h2>'));
  f.appendChild(h('<p class="q-help">We use the ZIP code to reflect local pricing in your area.</p>'));
  const field = h('<div class="field"><label for="zip">ZIP code</label>' +
    '<input class="input" id="zip" inputmode="numeric" autocomplete="postal-code" maxlength="10" placeholder="e.g. 30301" value="' + esc(state.zip) + '">' +
    '<div class="err" id="zip-err">Please enter a valid ZIP code.</div></div>');
  f.appendChild(field);
  const actions = h('<div class="actions"></div>');
  actions.appendChild(h('<button class="btn btn-primary" data-action="zip-next">Continue' + IC.arrow + '</button>'));
  f.appendChild(actions);
  return f;
}

function scrQuestion(q) {
  const f = document.createDocumentFragment();
  f.appendChild(backBtn());
  f.appendChild(h('<h2 class="q-title">' + esc(q.label) + '</h2>'));
  if (q.help) f.appendChild(h('<p class="q-help">' + esc(q.help) + '</p>'));

  if (q.type === "single") {
    const useIcons = q.options.some(function (o) { return o.ic; });
    const useImages = q.options.some(function (o) { return o.img; });
    const grid = h('<div class="grid ' + (useImages ? "img" : (useIcons ? "three" : "")) + '"></div>');
    q.options.forEach(function (o) {
      const sel = state.answers[q.id] === o.v;
      grid.appendChild(optionCard(q.id, o, sel, useIcons));
    });
    f.appendChild(grid);
    // storm-damage nudge on replacement condition
    if (q.id === "condition" && state.answers.condition === "storm" && state.service === "roof-replacement") {
      f.appendChild(h('<div class="nudge">' + IC.info + '<span>Storm damage may be covered by insurance. <button data-action="jump-storm">Switch to the insurance route</button></span></div>'));
    }
    // "Other" reveal + Continue (a single-select does not auto-advance when Other is picked)
    if (state.answers[q.id] === "other" && q.options.some(function (o) { return o.v === "other" && o.other; })) {
      f.appendChild(otherField(q.id, "Tell us what you have in mind"));
      const oa = h('<div class="actions"></div>');
      oa.appendChild(h('<button class="btn btn-primary" data-action="q-next">Continue' + IC.arrow + '</button>'));
      f.appendChild(oa);
    }
  } else {
    const chips = h('<div class="chips"></div>');
    const sels = state.answers[q.id] || [];
    q.options.forEach(function (o) {
      const sel = sels.indexOf(o.v) !== -1;
      chips.appendChild(h('<button class="chip ' + (sel ? "sel" : "") + '" data-action="toggle-multi" data-q="' + q.id + '" data-v="' + o.v + '">' + esc(o.l) + '<span class="x">' + IC.x + '</span></button>'));
    });
    f.appendChild(chips);
    if (sels.indexOf("other") !== -1 && q.options.some(function (o) { return o.v === "other" && o.other; })) {
      f.appendChild(otherField(q.id, "Tell us what is going on"));
    }
    const actions = h('<div class="actions"></div>');
    const canNext = sels.length > 0;
    actions.appendChild(h('<button class="btn btn-primary" data-action="q-next" ' + (canNext ? "" : "disabled") + '>Continue' + IC.arrow + '</button>'));
    f.appendChild(actions);
  }
  return f;
}

/* ---- Lead gate (two micro-steps, before_price) ---- */
function gateButtonLabel() {
  const svc = state.service, a = state.answers;
  if (isPricedService(svc, a)) return "Show my price range";
  if (svc === "inspection" || svc === "storm") return "Book my free inspection";
  return "Request a callback"; // new-construction, commercial non-priced
}
function gateHeadline() {
  return isPricedService(state.service, state.answers) ? "Your estimate is ready." : "Last step.";
}

function scrGate(step) {
  const f = document.createDocumentFragment();
  f.appendChild(backBtn());
  const isCommercial = state.service === "commercial";
  if (step === 0) {
    // Review: summary of selections + free-text notes, before we ask for contact details
    f.appendChild(h('<div class="eyebrow">Quick review</div>'));
    f.appendChild(h('<h2 class="q-title">Here is what you told us.</h2>'));
    f.appendChild(h('<p class="q-help">Give this a look before we pull your numbers. Use Back to change anything.</p>'));
    f.appendChild(buildSummary());
    const ta = h('<div class="field" style="margin-top:18px"><label for="notes">Anything else we should know? <span class="opt">(optional)</span></label>' +
      '<textarea class="textarea" id="notes" placeholder="For example: the roof leaks in heavy rain, there is a color you want to match, or a section you are most worried about.">' + esc(state.notes) + '</textarea></div>');
    f.appendChild(ta);
    const actions = h('<div class="actions"></div>');
    actions.appendChild(h('<button class="btn btn-primary" data-action="gate1-next">Continue' + IC.arrow + '</button>'));
    f.appendChild(actions);
  } else {
    f.appendChild(h('<div class="eyebrow">Almost done</div>'));
    f.appendChild(h('<h2 class="q-title">' + esc(gateHeadline()) + '</h2>'));
    f.appendChild(h('<p class="q-help">Tell us where to reach you and we will ' + (isPricedService(state.service, state.answers) ? "show your price range" : "get this scheduled") + '.</p>'));
    f.appendChild(textField("name", "First name", state.contact.name, "given-name", "text"));
    f.appendChild(textField("phone", "Phone", state.contact.phone, "tel", "tel"));
    f.appendChild(textField("email", "Email", state.contact.email, "email", "email"));
    if (isCommercial) f.appendChild(textField("companyName", "Company name", state.companyName, "organization", "text"));
    const actions = h('<div class="actions"></div>');
    actions.appendChild(h('<button class="btn btn-primary" data-action="gate2-submit">' + esc(gateButtonLabel()) + '</button>'));
    f.appendChild(actions);
    f.appendChild(consentBlock());
  }
  return f;
}

function answerSummaryRows() {
  const rows = [];
  rows.push(["Property", state.propertyType === "commercial" ? "Commercial" : "Residential"]);
  rows.push(["Service", (svcCfg(state.service).label) || ""]);
  if (state.zip) rows.push(["ZIP code", state.zip]);
  const qs = flatQuestions(state.service);
  qs.forEach(function (q) {
    const ans = state.answers[q.id];
    if (ans == null || (Array.isArray(ans) && ans.length === 0)) return;
    let text;
    if (Array.isArray(ans)) {
      text = ans.map(function (v) {
        if (v === "other") { var ot = state.answers[q.id + "_other"]; return ot ? "Other: " + ot : "Other"; }
        const o = q.options.filter(function (x) { return x.v === v; })[0]; return o ? o.l : v;
      }).join(", ");
    } else if (ans === "other") {
      var ot2 = state.answers[q.id + "_other"]; text = ot2 ? "Other: " + ot2 : "Other";
    } else {
      const o = q.options.filter(function (x) { return x.v === ans; })[0];
      text = o ? o.l : ans;
    }
    rows.push([q.summaryLabel || q.label, text]);
  });
  return rows;
}

function buildSummary() {
  const ul = h('<ul class="sum"></ul>');
  answerSummaryRows().forEach(function (r) {
    ul.appendChild(h('<li><span class="k">' + esc(r[0]) + '</span><span class="v">' + esc(r[1]) + '</span></li>'));
  });
  return ul;
}

function consentBlock() {
  return h('<div class="fineprint">' + esc(CONFIG.behavior.consentLine) +
    '<span class="lic">' + esc(CONFIG.business.licenseLine) + ' ' + esc(CONFIG.business.responsePromise) + '</span></div>');
}

/* ---- Results (priced) ---- */
function scrResults() {
  const f = document.createDocumentFragment();
  const svc = state.service, c = svcCfg(svc), est = state.estimate;
  const isCommercial = svc === "commercial";
  f.appendChild(h('<div class="result-eyebrow">' + esc(c.label) + '</div>'));
  f.appendChild(h('<div class="range-hero">' + fmt(est.low) + ' to ' + fmt(est.high) + (svc === "maintenance" ? ' / yr' : '') + '</div>'));
  f.appendChild(h('<div class="range-sub">Estimated range for your project</div>'));

  const recap = h('<div class="recap"></div>');
  recapChips(svc).forEach(function (r) { recap.appendChild(h('<span class="r">' + esc(r) + '</span>')); });
  f.appendChild(recap);

  // Timeline card
  const tl = timelineCopy();
  if (tl) f.appendChild(h('<div class="block timeline"><span class="ic">' + IC.clock + '</span><div><h3>Timeline</h3><p style="color:var(--c-muted);font-size:14.5px">' + esc(tl) + '</p></div></div>'));

  // What's included
  if (c.includedList && c.includedList.length) {
    const inc = h('<div class="block"><h3>What is included</h3></div>');
    const ul = h('<ul class="incl"></ul>');
    c.includedList.forEach(function (i) { ul.appendChild(h('<li>' + IC.checkSm + '<span>' + esc(i) + '</span></li>')); });
    inc.appendChild(ul);
    f.appendChild(inc);
  }

  // What could shift the price
  const shifts = priceShifts(svc);
  if (shifts.length) {
    const sh = h('<div class="block"><h3>What could shift the price</h3></div>');
    const ul = h('<ul class="shift"></ul>');
    shifts.forEach(function (i) { ul.appendChild(h('<li>' + IC.dot + '<span>' + esc(i) + '</span></li>')); });
    sh.appendChild(ul);
    f.appendChild(sh);
  }

  // Disclaimer
  const disc = (CONFIG.disclaimers.perService && CONFIG.disclaimers.perService[svc]) || CONFIG.disclaimers.default;
  f.appendChild(h('<div class="disclaimer"><h3>' + IC.info + 'Read this before you plan around a number</h3><p>' + esc(disc) + '</p></div>'));

  if (isCommercial) {
    f.appendChild(h('<div class="commercial-note">Commercial ranges are broad by nature. A site visit pins this down to a documented fixed proposal.</div>'));
  }

  f.appendChild(h('<div class="budget-line">Does this range fit your budget?</div>'));

  // after_price inline gate
  if (CONFIG.behavior.leadGate === "after_price" && !state.gateSubmitted) {
    f.appendChild(inlineGate());
  } else {
    f.appendChild(resultCtas(svc));
  }

  f.appendChild(financeBlock());
  f.appendChild(proofBlock());

  f.appendChild(h('<div style="text-align:center;margin-top:8px"><button class="textlink" data-action="start-over">Start over</button></div>'));
  return f;
}

function resultCtas(svc) {
  const box = h('<div class="result-cta"></div>');
  const bookBtn = h('<a class="btn btn-primary btn-block" href="' + esc(CONFIG.business.bookingUrl) + '" data-action="cta-book">' + IC.cal + 'Book my free inspection</a>');
  const callBtn = h('<a class="btn btn-ghost btn-block" href="' + telHref(CONFIG.business.phone) + '" data-action="cta-call">' + IC.phone + 'Call ' + esc(CONFIG.business.phone) + '</a>');
  if (CONFIG.behavior.ctaPrimary === "call") {
    callBtn.className = "btn btn-primary btn-block";
    bookBtn.className = "btn btn-ghost btn-block";
    box.appendChild(callBtn); box.appendChild(bookBtn);
  } else {
    box.appendChild(bookBtn); box.appendChild(callBtn);
  }
  if (svc === "roof-replacement") {
    box.appendChild(h('<div class="cta-note">You get a fixed written price that does not move after you sign.</div>'));
  }
  return box;
}

/* ---- Confirmation (no-price paths) ---- */
function scrConfirmation() {
  const f = document.createDocumentFragment();
  const svc = state.service;
  let headline = "", stepsData = [], note = "";

  if (svc === "inspection" || (svc === "commercial")) {
    if (svc === "commercial") {
      headline = "We will get you scheduled.";
      stepsData = [
        ["We call to set a time", "We reach out to schedule around your operations."],
        ["We inspect the roof", "A real look at the deck, drainage, and current system."],
        ["You get a documented report", "Photos and findings you can act on, with a clear path to a fixed proposal."]
      ];
    } else {
      headline = "You are one step from knowing exactly where your roof stands.";
      stepsData = [
        ["We call to schedule", "We reach out to set a time that works for you."],
        ["We inspect on the roof", "A real look, not a glance from the driveway."],
        ["You get a photo report", "One you will actually understand, whether or not you hire us."]
      ];
    }
  } else if (svc === "storm") {
    headline = "When the storm passes, we handle the rest.";
    stepsData = [
      ["We document the damage", "Full photo record on the roof, built for a claim."],
      ["We prepare the claim file", "Organized the way adjusters expect to see it."],
      ["We meet your adjuster on the roof", "So nothing gets missed or left off."]
    ];
    note = CONFIG.business.responsePromise;
  } else if (svc === "new-construction") {
    headline = "We build to your builder's schedule.";
    stepsData = [
      ["We call you back", CONFIG.business.responsePromise],
      ["We review the plans", "So the roof detailing is right from day one."],
      ["We line up with your framing", "Correct flashing details planned before dry-in, not patched after."]
    ];
  }

  f.appendChild(h('<div class="eyebrow">' + esc(svcCfg(svc).label) + '</div>'));
  f.appendChild(h('<h2 class="q-title">' + esc(headline) + '</h2>'));
  const ol = h('<ul class="steps-num"></ul>');
  stepsData.forEach(function (s, i) {
    ol.appendChild(h('<li><span class="n">' + (i + 1) + '</span><div><div class="st-t">' + esc(s[0]) + '</div><div class="st-d">' + esc(s[1]) + '</div></div></li>'));
  });
  f.appendChild(ol);
  if (note) f.appendChild(h('<p class="q-help" style="margin-top:18px">' + esc(note) + '</p>'));

  if (CONFIG.behavior.leadGate === "after_price" && !state.gateSubmitted) {
    f.appendChild(inlineGate());
  } else {
    const box = h('<div class="result-cta"></div>');
    box.appendChild(h('<a class="btn btn-primary btn-block" href="' + esc(CONFIG.business.bookingUrl) + '" data-action="cta-book">' + IC.cal + 'Book my free inspection</a>'));
    box.appendChild(h('<a class="btn btn-ghost btn-block" href="' + telHref(CONFIG.business.phone) + '" data-action="cta-call">' + IC.phone + 'Call ' + esc(CONFIG.business.phone) + '</a>'));
    f.appendChild(box);
  }
  f.appendChild(h('<div style="text-align:center;margin-top:8px"><button class="textlink" data-action="start-over">Start over</button></div>'));
  return f;
}

/* ---- Inline gate for after_price mode ---- */
function inlineGate() {
  const box = h('<div class="inline-gate"></div>');
  const priced = isPricedService(state.service, state.answers);
  box.appendChild(h('<h3 style="font-size:17px;font-weight:700;margin-bottom:6px">' + (priced ? "Want this range locked in? Book a free inspection." : "Ready to get started? Book a free inspection.") + '</h3>'));
  box.appendChild(textField("name", "First name", state.contact.name, "given-name", "text"));
  box.appendChild(textField("phone", "Phone", state.contact.phone, "tel", "tel"));
  box.appendChild(textField("email", "Email", state.contact.email, "email", "email"));
  if (state.service === "commercial") box.appendChild(textField("companyName", "Company name", state.companyName, "organization", "text"));
  const actions = h('<div class="actions"></div>');
  actions.appendChild(h('<button class="btn btn-primary btn-block" data-action="inline-gate-submit">' + (priced ? "Book my free inspection" : gateButtonLabel()) + '</button>'));
  box.appendChild(actions);
  box.appendChild(consentBlock());
  return box;
}

/* ---- Thank you ---- */
function scrThankYou() {
  const f = document.createDocumentFragment();
  let head = "You're all set!", body = "";
  if (state.ctaChoice === "book") { head = "Your inspection request is in!"; body = "We will confirm your time shortly. " + CONFIG.business.responsePromise; }
  else if (state.ctaChoice === "call") { head = "Talk soon!"; body = "If you did not reach us, we will call you right back. " + CONFIG.business.responsePromise; }
  else { head = "Your callback is booked!"; body = CONFIG.business.responsePromise; }
  f.appendChild(h('<h2 class="q-title" style="font-size:clamp(26px,5.5vw,38px)">' + esc(head) + '</h2>'));
  f.appendChild(h('<p class="lead">' + esc(body) + '</p>'));
  const box = h('<div class="result-cta" style="margin-top:24px"></div>');
  box.appendChild(h('<a class="btn btn-ghost btn-block" href="' + telHref(CONFIG.business.phone) + '" data-action="cta-call-plain">' + IC.phone + 'Call ' + esc(CONFIG.business.phone) + '</a>'));
  f.appendChild(box);
  f.appendChild(h('<div style="text-align:center;margin-top:12px"><button class="textlink" data-action="start-over">Start another estimate</button></div>'));
  return f;
}

/* --------------------------- Result helpers --------------------------- */
function timelineCopy() {
  const svc = state.service, a = state.answers;
  if (svc === "roof-repair" && (a.urgency === "now" || (a.issues || []).indexOf("leaking") !== -1)) {
    return "Active leaks get same-week scheduling.";
  }
  return svcCfg(svc).timelineCopy || "";
}

function label(qId, val) {
  const qs = flatQuestions(state.service);
  for (let i = 0; i < qs.length; i++) {
    if (qs[i].id === qId) {
      const o = qs[i].options.filter(function (x) { return x.v === val; })[0];
      return o ? o.l : val;
    }
  }
  return val;
}

function recapChips(svc) {
  const a = state.answers, out = [];
  if (svc === "roof-replacement") {
    out.push(label("stories", a.stories));
    out.push(label("steepness", a.steepness).toLowerCase() + " pitch");
    out.push(label("newMaterial", a.newMaterial));
    if (a.currentRoof === "asphalt2") out.push("2+ layer tear-off");
  } else if (svc === "roof-repair") {
    out.push(label("extent", a.extent));
    out.push(label("stories", a.stories));
  } else if (svc === "gutters") {
    out.push(label("needed", a.needed));
    out.push(label("material", a.material));
    out.push(label("homeSize", a.homeSize));
  } else if (svc === "siding") {
    out.push(label("scope", a.scope));
    out.push(label("material", a.material));
  } else if (svc === "skylights") {
    out.push(label("type", a.type));
    out.push(label("count", a.count) + " unit" + (a.count === "1" ? "" : "s"));
  } else if (svc === "maintenance") {
    out.push(label("roofMaterial", a.roofMaterial));
    out.push(label("homeSize", a.homeSize));
  } else if (svc === "commercial") {
    out.push(label("buildingType", a.buildingType));
    out.push(label("system", a.system));
    out.push(label("roofSize", a.roofSize));
  }
  return out.filter(Boolean);
}

function priceShifts(svc) {
  const a = state.answers, out = [];
  if (svc === "roof-replacement") {
    if (state.estimate && state.estimate.area) out.push("Roof size. We put your roof at about " + (Math.round(state.estimate.area / 50) * 50).toLocaleString() + " sq ft from the footprint and pitch you gave us. The exact figure is measured on site.");
    if (a.timeline) out.push("Timeline. You asked to start " + label("timeline", a.timeline).toLowerCase() + ". Crew availability and material lead times can move the number.");
    out.push("Decking condition. We can only confirm it once the old roof comes off.");
    if (a.currentRoof === "asphalt2") out.push("Removing two or more existing layers adds tear-off labor and disposal.");
    if (a.steepness === "steep") out.push("A steep pitch means more safety setup and slower, more careful work.");
    const acc = (a.access || []).filter(function (x) { return x !== "none"; });
    if (acc.length) out.push("Access at your property, like " + acc.map(function (x) { return label("access", x).toLowerCase(); }).join(" and ") + ", checked on site the day we measure.");
    else out.push("Access and staging at your address, checked on site the day we measure the roof.");
    return out.slice(0, 6);
  }
  if (svc === "roof-repair") {
    out.push("What we find once we open up the area. Damage often runs past what shows on the surface.");
    if (a.steepness === "steep") out.push("A steep pitch means more safety setup.");
    out.push("Decking or flashing that needs replacing underneath.");
    return out.slice(0, 3);
  }
  if (svc === "gutters") {
    out.push("Fascia or soffit repairs found once the old gutters come down.");
    out.push("Extra downspouts or drainage work to move water away from the foundation.");
    return out;
  }
  if (svc === "siding") {
    out.push("Sheathing or moisture damage found behind the old siding.");
    out.push("Trim, corners, and window wrapping details.");
    return out;
  }
  if (svc === "skylights") {
    out.push("Decking or framing around the opening once we get in.");
    out.push("Interior finish work if you want it fully finished, not just ready for paint.");
    return out;
  }
  if (svc === "maintenance") {
    out.push("Any repairs found during the first visit are quoted separately, with plan-member pricing.");
    return out;
  }
  if (svc === "commercial") {
    if (state.estimate && state.estimate.area) out.push("Roof size. Based on the range you gave, about " + (Math.round(state.estimate.area / 500) * 500).toLocaleString() + " sq ft. We measure the exact area on site.");
    if (a.timeline) out.push("Timeline. You asked to start " + label("timeline", a.timeline).toLowerCase() + ", which affects crew scheduling and material lead times.");
    out.push("Deck condition and any wet insulation found during the site visit.");
    out.push("Drainage, code upgrades, and roof penetrations specific to your building.");
    out.push("Access and staging at your building's address" + (a.occupied === "yes" || a.occupied === "partially" ? " while it stays occupied" : "") + ".");
    return out.slice(0, 6);
  }
  return out;
}

/* --------------------------- Reusable builders --------------------------- */
function backBtn() { return h('<button class="backlink" data-action="back">' + IC.back + 'Back</button>'); }

function otherField(qId, ph) {
  const val = state.answers[qId + "_other"] || "";
  return h('<div class="other-wrap"><input class="other-input" data-otherq="' + qId + '" placeholder="' + esc(ph || "Tell us more") + '" value="' + esc(val) + '"></div>');
}

function readOtherFields() {
  document.querySelectorAll('[data-otherq]').forEach(function (el) {
    state.answers[el.dataset.otherq + "_other"] = el.value.trim();
  });
}

function flatQuestions(svc) {
  const qs = QUESTIONS[svc] || [];
  const out = [];
  qs.forEach(function (q) { if (q.group) q.items.forEach(function (it) { out.push(it); }); else out.push(q); });
  return out;
}

function groupComplete(group) {
  return group.items.every(function (q) {
    const a = state.answers[q.id];
    if (!a) return false;
    if (a === "other") return !!(state.answers[q.id + "_other"] && state.answers[q.id + "_other"].length);
    return true;
  });
}

function scrGroup(group) {
  const f = document.createDocumentFragment();
  f.appendChild(backBtn());
  f.appendChild(h('<h2 class="q-title">' + esc(group.group) + '</h2>'));
  if (group.help) f.appendChild(h('<p class="q-help">' + esc(group.help) + '</p>'));

  group.items.forEach(function (q) {
    const block = h('<div class="subq"></div>');
    block.appendChild(h('<div class="subq-lbl">' + esc(q.label) + '</div>'));
    if (q.help) block.appendChild(h('<p class="subq-help">' + esc(q.help) + '</p>'));
    const useIcons = q.options.some(function (o) { return o.ic; });
    const useImages = q.options.some(function (o) { return o.img; });
    const grid = h('<div class="grid ' + (useImages ? "img" : (useIcons ? "three" : "")) + '"></div>');
    q.options.forEach(function (o) {
      const sel = state.answers[q.id] === o.v;
      grid.appendChild(optionCard(q.id, o, sel, useIcons, "answer-group"));
    });
    block.appendChild(grid);
    if (state.answers[q.id] === "other" && q.options.some(function (o) { return o.v === "other" && o.other; })) {
      block.appendChild(otherField(q.id, "Tell us more"));
    }
    if (q.id === "condition" && state.answers.condition === "storm" && state.service === "roof-replacement") {
      block.appendChild(h('<div class="nudge">' + IC.info + '<span>Storm damage may be covered by insurance. <button data-action="jump-storm">Switch to the insurance route</button></span></div>'));
    }
    f.appendChild(block);
  });

  const actions = h('<div class="actions"></div>');
  const done = groupComplete(group);
  actions.appendChild(h('<button class="btn btn-primary" data-action="group-next" ' + (done ? "" : "disabled") + '>Continue' + IC.arrow + '</button>'));
  f.appendChild(actions);
  return f;
}

function googleBadge() {
  let stars = ""; for (let i = 0; i < 5; i++) stars += IC.star;
  return h('<span class="gbadge">' + IC.google + '<span class="gstars">' + stars + '</span><span class="gtext"><b>' + esc(CONFIG.social.reviewsRating) + '</b> \u00b7 ' + esc(CONFIG.social.reviewsCount) + ' Google reviews</span></span>');
}

function financeBlock() {
  return h('<div class="finance">' + IC.card + '<div><h4>' + esc(CONFIG.social.financingHeadline) + '</h4><p>' + esc(CONFIG.social.financingLine) + '</p></div></div>');
}

function proofBlock() {
  const box = h('<div class="proof"></div>');
  const head = h('<div class="proof-head"><h3>Homeowners who started right here</h3></div>');
  head.appendChild(googleBadge());
  box.appendChild(head);
  const list = h('<div class="tstmnl"></div>');
  (CONFIG.social.testimonials || []).forEach(function (t) {
    list.appendChild(h('<div class="q"><div class="qs">\u2605\u2605\u2605\u2605\u2605</div><p>' + esc(t.quote) + '</p><div class="who">' + esc(t.who) + '</div></div>'));
  });
  box.appendChild(list);
  return box;
}

function scrBooking() {
  const f = document.createDocumentFragment();
  f.appendChild(h('<button class="backlink" data-action="back">' + IC.back + 'Back to my estimate</button>'));
  f.appendChild(h('<div class="eyebrow">Free on-roof inspection</div>'));
  f.appendChild(h('<h2 class="q-title">Pick a time that works for you.</h2>'));
  f.appendChild(h('<p class="q-help">Choose a slot below. You will get a confirmation by email, and we will call to confirm the details.</p>'));
  const frame = h('<div class="booking-frame"></div>');
  frame.appendChild(h('<iframe src="' + esc(CONFIG.business.calendarUrl) + '" title="Book your free roof inspection" loading="lazy"></iframe>'));
  f.appendChild(frame);
  f.appendChild(h('<div class="cta-note" style="margin-top:14px">Prefer to talk first? Call <a href="' + telHref(CONFIG.business.phone) + '" data-action="cta-call-plain">' + esc(CONFIG.business.phone) + '</a>.</div>'));
  f.appendChild(h('<div style="text-align:center;margin-top:12px"><button class="textlink" data-action="start-over">Start over</button></div>'));
  return f;
}

function bigCard(value, icon, lbl, sub, sel, action) {
  return h('<button class="card ' + (sel ? "sel" : "") + '" data-action="' + action + '" data-v="' + value + '">' +
    '<span class="ic">' + (icon || "") + '</span>' +
    '<span class="body"><span class="lbl">' + esc(lbl) + '</span>' + (sub ? '<span class="sub">' + esc(sub) + '</span>' : '') + '</span>' +
    '<span class="chk">' + IC.checkSm + '</span></button>');
}

function optionCard(qId, o, sel, useIcons, action) {
  action = action || "answer-single";
  const icon = o.ic ? IC[o.ic] : "";
  const tag = o.tag ? '<span class="tag">' + esc(o.tag) + '</span>' : "";
  if (o.img) {
    return h('<button class="card imgcard ' + (sel ? "sel" : "") + '" data-action="' + action + '" data-q="' + qId + '" data-v="' + o.v + '">' +
      '<span class="imgwrap"><img src="' + o.img + '" alt="' + esc(o.l) + '" loading="lazy" onerror="this.closest(\'.imgwrap\').classList.add(\'noimg\');this.remove()"></span>' +
      '<span class="lbl">' + esc(o.l) + '</span>' +
      '<span class="chk">' + IC.checkSm + '</span></button>');
  }
  if (useIcons) {
    return h('<button class="card compact ' + (sel ? "sel" : "") + '" data-action="' + action + '" data-q="' + qId + '" data-v="' + o.v + '" style="flex-direction:column;align-items:center;text-align:center;gap:10px">' +
      '<span style="color:var(--c-primary)">' + icon + '</span>' +
      '<span class="lbl">' + esc(o.l) + '</span>' +
      '<span class="chk">' + IC.checkSm + '</span></button>');
  }
  return h('<button class="card compact ' + (sel ? "sel" : "") + '" data-action="' + action + '" data-q="' + qId + '" data-v="' + o.v + '">' +
    '<span class="body"><span class="lbl">' + esc(o.l) + '</span>' + (o.hint ? '<span class="sub">' + esc(o.hint) + '</span>' : '') + tag + '</span>' +
    '<span class="chk">' + IC.checkSm + '</span></button>');
}

function textField(id, lbl, val, autoc, type) {
  return h('<div class="field"><label for="fld-' + id + '">' + esc(lbl) + '</label>' +
    '<input class="input" id="fld-' + id + '" type="' + type + '" autocomplete="' + autoc + '" value="' + esc(val) + '">' +
    '<div class="err" id="err-' + id + '">This field is required.</div></div>');
}

/* --------------------------- Interaction --------------------------- */
function readInput(id) { const el = document.getElementById(id); return el ? el.value.trim() : ""; }
function setErr(id, on) { const el = document.getElementById(id); if (el) el.classList.toggle("on", !!on); }

function readGateFields(inline) {
  // Only overwrite a field if its input is present on the current screen,
  // so step 2 does not wipe the name/phone/email captured on step 1.
  const nm = document.getElementById("fld-name"); if (nm) state.contact.name = nm.value.trim();
  const ph = document.getElementById("fld-phone"); if (ph) state.contact.phone = ph.value.trim();
  const em = document.getElementById("fld-email"); if (em) state.contact.email = em.value.trim();
  const addr = document.getElementById("fld-address"); if (addr) state.contact.address = addr.value.trim();
  const co = document.getElementById("fld-companyName"); if (co) state.companyName = co.value.trim();
  const notes = document.getElementById("notes"); if (notes) state.notes = notes.value.trim();
}
function validGate1() {
  let ok = true;
  if (!state.contact.name) { setErr("err-name", true); ok = false; } else setErr("err-name", false);
  if (!/[0-9]{7,}/.test(state.contact.phone.replace(/[^0-9]/g, ""))) { setErr("err-phone", true); ok = false; } else setErr("err-phone", false);
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(state.contact.email)) { setErr("err-email", true); ok = false; } else setErr("err-email", false);
  return ok;
}

document.addEventListener("input", function (e) {
  // live-clear zip error
  if (e.target && e.target.id === "zip") setErr("zip-err", false);
});

app.addEventListener("click", function (e) {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  readOtherFields();
  const action = el.dataset.action;
  const isLink = el.tagName === "A";

  switch (action) {
    case "start-residential":
      state.propertyType = "residential"; state.service = null; state.answers = {};
      track("step_complete", { step: "property" });
      state.screen = "service"; render(true); break;
    case "start-commercial":
      state.propertyType = "commercial"; state.service = "commercial"; state.answers = {};
      track("step_complete", { step: "property" });
      buildFlow(); state.screen = "flow"; render(true); break;

    case "select-property": {
      const v = el.dataset.v;
      state.propertyType = v;
      if (v === "commercial") { state.service = "commercial"; state.answers = {}; buildFlow(); state.screen = "flow"; render(true); }
      else { state.service = null; state.screen = "service"; render(true); }
      break;
    }
    case "select-service": {
      state.service = el.dataset.v; state.answers = {}; buildFlow(); state.screen = "flow"; render(true);
      break;
    }
    case "answer-single": {
      const q = el.dataset.q, v = el.dataset.v;
      state.answers[q] = v;
      updateEmergency();
      track("step_complete", { step: q });
      // reflect selection then auto-advance
      const cards = el.parentNode.querySelectorAll(".card");
      cards.forEach(function (c) { c.classList.remove("sel"); });
      el.classList.add("sel");
      const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      // storm nudge case: do not auto-advance, let user read the nudge
      if (q === "condition" && v === "storm") { render(); break; }
      if (v === "other") { render(); break; }
      setTimeout(function () { goNext(); }, reduce ? 0 : 160);
      break;
    }
    case "toggle-multi": {
      const q = el.dataset.q, v = el.dataset.v;
      const opt = (QUESTIONS[state.service].filter(function (x) { return x.id === q; })[0].options.filter(function (o) { return o.v === v; })[0]);
      let arr = state.answers[q] || [];
      if (opt && opt.none) { arr = (arr.indexOf(v) !== -1) ? [] : [v]; }
      else {
        arr = arr.filter(function (x) {
          const oo = QUESTIONS[state.service].filter(function (s) { return s.id === q; })[0].options.filter(function (o) { return o.v === x; })[0];
          return !(oo && oo.none);
        });
        if (arr.indexOf(v) !== -1) arr = arr.filter(function (x) { return x !== v; }); else arr.push(v);
      }
      state.answers[q] = arr;
      updateEmergency();
      render();
      break;
    }
    case "answer-group": {
      const gq = el.dataset.q, gv = el.dataset.v;
      state.answers[gq] = gv;
      updateEmergency();
      track("step_complete", { step: gq });
      render();
      break;
    }
    case "group-next":
      track("step_complete", { step: currentStep().group ? currentStep().group.group : "" });
      goNext(); break;
    case "q-next":
      track("step_complete", { step: currentStep().q ? currentStep().q.id : "" });
      goNext(); break;

    case "zip-next": {
      const z = readInput("zip");
      if (!/^[0-9]{5}(-[0-9]{4})?$/.test(z)) { setErr("zip-err", true); break; }
      state.zip = z; track("step_complete", { step: "zip" }); goNext(); break;
    }
    case "gate1-next":
      readGateFields(false);
      track("gate_view", { step: 1 }); goNext();
      break;
    case "gate2-submit":
      readGateFields(false);
      if (!validGate1()) break;
      finishFlow();
      break;
    case "inline-gate-submit":
      readGateFields(true);
      if (!validGate1()) break;
      state.gateSubmitted = true;
      logLead();
      render();
      break;

    case "jump-storm":
      state.service = "storm"; state.answers = {}; state.emergency = false;
      buildFlow(); state.screen = "flow"; render(true); break;

    case "back": goBack(); break;

    case "cta-book":
      state.ctaChoice = "book"; track("cta_book");
      // Prefer the in-app booking calendar; fall back to the thank-you demo state.
      if (CONFIG.business.calendarUrl) { e.preventDefault(); state.screen = "booking"; render(true); }
      else if (CONFIG.business.bookingUrl === "#book") { e.preventDefault(); state.screen = "thankyou"; render(true); }
      break;
    case "cta-call":
      track("cta_call");
      state.ctaChoice = "call";
      if (state.screen === "results" || state.screen === "confirmation") { /* let tel: fire, then show thanks */ setTimeout(function () { state.screen = "thankyou"; render(true); }, 50); }
      break;
    case "cta-call-plain":
      track("cta_call"); break;

    case "start-over": resetAll(); break;
  }
});

function updateEmergency() {
  if (state.service !== "storm") { state.emergency = false; return; }
  const what = state.answers.what || [];
  state.emergency = (what.indexOf("water") !== -1 || what.indexOf("tarp") !== -1);
}

function resetAll() {
  state.screen = "welcome";
  state.propertyType = null; state.service = null; state.zip = "";
  state.answers = {}; state.flow = []; state.stepIndex = 0;
  state.contact = { name: "", phone: "", email: "", address: "" };
  state.companyName = ""; state.notes = ""; state.estimate = null;
  state.emergency = false; state.gateSubmitted = false; state.ctaChoice = null;
  render(true);
}

init();
})();
</script>
